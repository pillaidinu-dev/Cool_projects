name: NBA daily props

# Refreshes the NBA dashboard's data in the morning (grade last night,
# project today) and again before tip-off (re-project with the latest injury
# news — the pipeline never touches a slate once it has started), then
# commits nba-dashboard/data/ so every day's props and results accumulate in
# the repo.
#
# GitHub delays scheduled runs by minutes to hours and sometimes skips them
# outright (on 2026-10-22 the morning run never started), so there are
# several slots rather than one each. Extra runs are cheap and safe: each
# only fetches dates it hasn't stored, and a slate that has tipped off is
# frozen. Times are UTC — 11:17/13:17/15:17 ≈ 7/9/11am ET and 20:47/22:47 ≈
# 4:47/6:47pm ET (an hour earlier in winter).
#
# GitHub only runs scheduled (and manually dispatched) workflows from the
# repo's *default* branch, so this file has to be on that branch for those
# to work. It always checks out and commits to main, whichever branch that
# is. A push to main that changes the pipeline also runs it (push triggers
# work from any branch), so code changes take effect without waiting for
# the next scheduled run. The job's own data commits never re-trigger it:
# pushes made with GITHUB_TOKEN don't start workflows, and data/ isn't in
# the paths below anyway.
on:
  schedule:
    - cron: '17 11,13,15 * * *'
    - cron: '47 20,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nba-daily.yml
      - nba-dashboard/ml/**

permissions:
  contents: write

concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nba-dashboard/ml/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: nba-dashboard/ml

      - name: Run the daily pipeline
        working-directory: nba-dashboard/ml
        run: python daily.py

      - name: Commit accumulated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "NBA props: daily refresh $(TZ=America/New_York date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
