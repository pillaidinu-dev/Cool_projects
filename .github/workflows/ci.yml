name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Start server and hit health check
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1

  nfl-dashboard-client:
    name: NFL Dashboard client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-dashboard/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nfl-dashboard/client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nfl-dashboard-server:
    name: NFL Dashboard server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-dashboard/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nfl-dashboard/server/package-lock.json

      - run: npm ci

      - name: Start server and hit health check
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4100/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1
