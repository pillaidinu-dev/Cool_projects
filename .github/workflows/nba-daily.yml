name: NBA daily props

# Refreshes the NBA dashboard's data once in the morning (grade last night,
# project today) and again before tip-off (re-project with the latest injury
# news — the pipeline never touches a slate once it has started), then
# commits nba-dashboard/data/ so every day's props and results accumulate in
# the repo. Times are UTC: 14:17 / 21:47 ≈ 10:17am / 5:47pm US Eastern (an hour
# earlier in winter).
#
# GitHub only runs scheduled (and manually dispatched) workflows from the
# repo's *default* branch, so this file has to be on that branch to run at
# all. It always checks out and commits to main, whichever branch that is.
on:
  schedule:
    - cron: '17 14 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nba-dashboard/ml/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: nba-dashboard/ml

      - name: Run the daily pipeline
        working-directory: nba-dashboard/ml
        run: python daily.py

      - name: Commit accumulated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "NBA props: daily refresh $(TZ=America/New_York date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
