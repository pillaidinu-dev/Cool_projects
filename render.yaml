services:
  - type: web
    name: plansync
    env: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - Dockerfile
        - client/**
        - server/**
      ignoredPaths:
        - nfl-dashboard/**
        - momentum-dashboard/**
        - nba-dashboard/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false

  - type: web
    name: nfl-dashboard
    env: docker
    branch: main
    dockerfilePath: ./nfl-dashboard/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - nfl-dashboard/**

  - type: web
    name: planner-pal
    env: docker
    branch: main
    dockerfilePath: ./planner-pal/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - planner-pal/**

  - type: web
    name: momentum-dashboard
    env: docker
    branch: main
    dockerfilePath: ./momentum-dashboard/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - momentum-dashboard/**

  - type: web
    name: nba-dashboard
    env: docker
    branch: main
    dockerfilePath: ./nba-dashboard/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - nba-dashboard/**
      # The daily data commits are read live from GitHub (NBA_DATA_URL), so
      # they don't need a rebuild — only code changes do.
      ignoredPaths:
        - nba-dashboard/data/**
    envVars:
      - key: NBA_DATA_URL
        value: https://raw.githubusercontent.com/pillaidinu-dev/Cool_projects/main/nba-dashboard/data
