<title>Layers by the Spoon Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first ledger. Sticky header + tab bar, one column of sections; widens to two columns on desktop. Layer-stripe motif = a dessert cup's stacked layers. */
:root {
  --bg: #FAF6F4;
  --surface: #FFFFFF;
  --sunk: #F2EBE8;
  --ink: #2A1C19;
  --muted: #7A6863;
  --line: #E6DBD7;
  --accent: #A8285F;      /* berry compote */
  --accent-ink: #FFFFFF;
  --caramel: #C2832F;
  --cocoa: #5A3628;
  --cream: #F3E3C8;
  --good: #23805C;
  --bad: #B3402A;
  --warn: #A86A10;
  --good-bg: #E3F3EB;
  --bad-bg: #F8E4DF;
  --warn-bg: #F7EBD5;
  --shadow: 0 1px 2px rgba(42,28,25,.06), 0 6px 20px rgba(42,28,25,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1312; --surface: #241A18; --sunk: #2E2220; --ink: #F4EAE6; --muted: #B29F99; --line: #3C2E2B;
    --accent: #E2689B; --accent-ink: #1A1312; --caramel: #DDA55A; --cocoa: #B98571; --cream: #5A4A33;
    --good: #5CC79A; --bad: #EE8670; --warn: #E7B156;
    --good-bg: #1D3329; --bad-bg: #3A221D; --warn-bg: #3A2D17;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1312; --surface: #241A18; --sunk: #2E2220; --ink: #F4EAE6; --muted: #B29F99; --line: #3C2E2B;
  --accent: #E2689B; --accent-ink: #1A1312; --caramel: #DDA55A; --cocoa: #B98571; --cream: #5A4A33;
  --good: #5CC79A; --bad: #EE8670; --warn: #E7B156;
  --good-bg: #1D3329; --bad-bg: #3A221D; --warn-bg: #3A2D17;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 12px 8px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; margin: 0; line-height: 1.1; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.brand .grow { flex: 1; min-width: 0; }
.layers { height: 4px; display: flex; }
.layers i { flex: 1; } .layers i:nth-child(1){background:var(--cream)} .layers i:nth-child(2){background:var(--caramel)} .layers i:nth-child(3){background:var(--accent)} .layers i:nth-child(4){background:var(--cocoa)}
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 4px 8px; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

main { padding-block: 16px 96px; display: grid; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 8px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.hero { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpi.hero .eyebrow, .kpi.hero .s { color: inherit; opacity: .75; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.kpi.hero .pos, .kpi.hero .neg { color: inherit; }

.grid2 { display: grid; gap: 16px; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 3fr 2fr; } }

/* lists */
.list { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--sunk); }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .a { font-weight: 700; text-align: right; }
.item .d { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.item .p { font-size: 13px; text-align: right; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; vertical-align: 1px; }
.chip.paid { background: var(--good-bg); color: var(--good); }
.chip.unpaid { background: var(--warn-bg); color: var(--warn); }
.chip.ex { background: var(--sunk); color: var(--muted); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty .cup { margin: 0 auto 10px; width: 44px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 160px; }

/* chart */
.chart-wrap { overflow-x: auto; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.bars { display: grid; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.barrow .track { grid-column: 1 / -1; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.barrow .fill { height: 100%; background: var(--caramel); border-radius: 4px; }

/* forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea { resize: vertical; min-height: 60px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0,1fr)); }
.fgrid .full { grid-column: 1 / -1; }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px 36px; gap: 6px; align-items: center; }
.line input, .line select { padding: 9px 8px; }
.line .lt { text-align: right; font-size: 13px; font-weight: 600; }
.x { border: 0; background: var(--sunk); border-radius: 8px; height: 38px; cursor: pointer; color: var(--muted); font-size: 18px; }
.sumbox { background: var(--sunk); border-radius: 10px; padding: 12px; display: grid; gap: 4px; font-size: 14px; }
.sumbox div { display: flex; justify-content: space-between; gap: 8px; }
.sumbox .big { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }

/* sheet */
.overlay { position: fixed; inset: 0; background: rgba(20,12,10,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 18px; padding: 22px; } }
.sheet-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px; }

.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; border-radius: 999px; padding: 14px 20px; box-shadow: 0 6px 24px rgba(168,40,95,.35); font-size: 15px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 4px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow-main { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.mrow-main .t { font-weight: 600; overflow-wrap: anywhere; }
.mrow-main .d { font-size: 13px; color: var(--muted); }
.mrow.is-hidden .mrow-main { opacity: .6; }
.mrow-act { display: flex; gap: 6px; flex-wrap: wrap; }
.bulk { display: grid; gap: 8px; }
.bulk-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 6px; align-items: center; }
.bulk-row input { padding: 9px 8px; }
.bulk-head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bulk-m { text-align: right; font-size: 13px; font-weight: 600; }

@media (min-width: 860px) { .grid2.even { grid-template-columns: 1fr 1fr; } }
.goal { display: grid; gap: 6px; }
.gtrack { height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.gfill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--caramel), var(--accent)); }
.gfill.met { background: var(--good); }
.prep { display: flex; flex-wrap: wrap; gap: 8px; }
.prep-i { display: inline-flex; align-items: center; gap: 8px; background: var(--sunk); border-radius: 10px; padding: 6px 10px 6px 6px; font-size: 14px; font-weight: 500; min-width: 0; }
.prep-n { background: var(--ink); color: var(--bg); border-radius: 7px; min-width: 28px; padding: 2px 6px; text-align: center; font-weight: 700; }
.time { color: var(--accent); font-weight: 700; margin-right: 4px; }
.linklike { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.overdue { border-color: var(--bad); }
.minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mv { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.mvs { font-size: 14px; font-weight: 500; }
table.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
table.mini td { padding: 6px 0; border-top: 1px solid var(--line); }
table.mini td:last-child { text-align: right; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <path d="M7 9h20l-2.4 19a3 3 0 0 1-3 2.6h-9.2a3 3 0 0 1-3-2.6z" fill="var(--sunk)" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M8.9 24h16.2l-.5 4.1a1.6 1.6 0 0 1-1.6 1.4H11a1.6 1.6 0 0 1-1.6-1.4z" fill="var(--cocoa)"/>
        <path d="M8.3 19h17.4l-.6 5H8.9z" fill="var(--cream)"/>
        <path d="M7.7 14h18.6l-.6 5H8.3z" fill="var(--accent)"/>
        <path d="M7.2 10h19.6l-.5 4H7.7z" fill="var(--caramel)"/>
        <path d="M20 3c2.5 0 4 1.6 4 3.5S22.6 9 21 9" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="grow">
        <h1>Layers by the Spoon</h1>
        <small>Sales &amp; profit ledger</small>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="pickups" aria-selected="false">Pickups</button>
      <button role="tab" data-tab="orders" aria-selected="false">Orders</button>
      <button role="tab" data-tab="expenses" aria-selected="false">Expenses</button>
      <button role="tab" data-tab="menu" aria-selected="false">Menu</button>
    </nav>
  </div>
  <div class="layers" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</header>

<div class="wrap">
  <main id="main">
    <div id="status" class="banner" hidden></div>
    <section id="view"></section>
  </main>
</div>
<button id="fab" class="btn primary fab" type="button">+ New order</button>
<div id="sheetHost"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  // ---------- state ----------
  const S = {
    tab: "overview", period: "month",
    orders: [], expenses: [], products: [], packs: [], settings: { currency: "$" },
    loaded: { orders: false, expenses: false, products: false, packs: false },
    db: null, canWrite: true, downloads: null, q: "",
  };
  try { const t = localStorage.getItem("lbs-tab"); if (t) S.tab = t; const p = localStorage.getItem("lbs-period"); if (p) S.period = p; } catch (e) {}

  const EXP_CATS = ["Ingredients", "Packaging", "Equipment", "Marketing", "Delivery / fuel", "Fees & permits", "Other"];
  const PAY = ["Cash", "Card", "Bank transfer", "Payment app", "Other"];

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = (v) => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const r2 = (x) => Math.round(x * 100) / 100;
  const money = (x, sign = false) => {
    const c = S.settings.currency || "$";
    const neg = x < 0; const abs = Math.abs(x);
    const s = abs.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (neg ? "−" : (sign && x > 0 ? "+" : "")) + c + s;
  };
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fmtDate = (s) => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };
  const monthKey = (s) => (s || "").slice(0, 7);
  const monthLabel = (k) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "short" }); };

  function orderCalc(o) {
    const items = Array.isArray(o.items) ? o.items : [];
    const packs = Array.isArray(o.packs) ? o.packs.filter(p => p.packId || p.name) : [];
    const flavorCups = items.reduce((a, i) => a + n(i.qty), 0);
    const packCups = packs.reduce((a, p) => a + n(p.qty) * n(p.cups), 0);
    // Pack orders are priced by pack; orders logged before packs existed keep their per-cup prices.
    const subtotal = packs.length ? packs.reduce((a, p) => a + n(p.qty) * n(p.price), 0) : items.reduce((a, i) => a + n(i.qty) * n(i.price), 0);
    const cost = items.reduce((a, i) => a + n(i.qty) * n(i.cost), 0);
    const revenue = subtotal + n(o.deliveryFee) - n(o.discount);
    return { cups: Math.max(flavorCups, packCups), flavorCups, packCups, subtotal, cost, revenue, profit: revenue - cost };
  }

  function inPeriod(dateStr, period) {
    if (period === "all") return true;
    const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
    const k = monthKey(dateStr);
    const key = (yy, mm) => yy + "-" + String(mm + 1).padStart(2, "0");
    if (period === "month") return k === key(y, m);
    if (period === "last") { const d = new Date(y, m - 1, 1); return k === key(d.getFullYear(), d.getMonth()); }
    if (period === "year") return (dateStr || "").startsWith(String(y));
    return true;
  }
  const PERIODS = [["month", "This month"], ["last", "Last month"], ["year", "This year"], ["all", "All time"]];

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function showStatus(msg) { const s = $("#status"); if (!msg) { s.hidden = true; return; } s.textContent = msg; s.hidden = false; }

  const cupSvg = `<svg class="cup" viewBox="0 0 34 34" aria-hidden="true"><path d="M7 9h20l-2.4 19a3 3 0 0 1-3 2.6h-9.2a3 3 0 0 1-3-2.6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 19h17.4M7.7 14h18.6M8.9 24h16.2" stroke="currentColor" stroke-width="1.2" opacity=".5"/></svg>`;

  // ---------- rendering ----------
  function setTab(t) {
    S.tab = t; try { localStorage.setItem("lbs-tab", t); } catch (e) {}
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    const fab = $("#fab");
    fab.hidden = !S.canWrite;
    fab.textContent = t === "expenses" ? "+ New expense" : t === "menu" ? "+ New flavor" : "+ New order";
    render();
  }

  function periodSeg() {
    return `<div class="seg" role="group" aria-label="Period">${PERIODS.map(([k, l]) => `<button type="button" data-period="${k}" aria-pressed="${S.period === k}">${l}</button>`).join("")}</div>`;
  }

  function render() {
    const v = $("#view");
    if (S.tab === "overview") v.innerHTML = renderOverview();
    else if (S.tab === "pickups") v.innerHTML = renderPickups();
    else if (S.tab === "orders") v.innerHTML = renderOrders();
    else if (S.tab === "expenses") v.innerHTML = renderExpenses();
    else v.innerHTML = renderMenu();
  }

  function loadingOr(key, html) {
    if (!S.loaded[key] && S.db) return `<div class="empty">Loading…</div>`;
    return html;
  }

  function renderOverview() {
    const P = S.period;
    const orders = S.orders.filter(o => inPeriod(o.date, P));
    const exps = S.expenses.filter(e => inPeriod(e.date, P));
    let sales = 0, cogs = 0, cups = 0, unpaid = 0, unpaidN = 0;
    for (const o of orders) { const c = orderCalc(o); sales += c.revenue; cogs += c.cost; cups += c.cups; if (o.status === "unpaid") { unpaid += c.revenue; unpaidN++; } }
    const spent = exps.reduce((a, e) => a + n(e.amount), 0);
    const net = sales - spent;
    const margin = sales > 0 ? Math.round((net / sales) * 100) : null;
    const avg = orders.length ? sales / orders.length : 0;
    const estProfit = sales - cogs;

    // flavors
    const fl = {};
    const pm = {};
    for (const o of orders) {
      for (const i of (o.items || [])) { const k = i.name || "Unnamed"; fl[k] = fl[k] || { cups: 0 }; fl[k].cups += n(i.qty); }
      for (const p of (o.packs || [])) { const k = p.name || "Pack"; pm[k] = (pm[k] || 0) + n(p.qty); }
    }
    const packMix = Object.entries(pm).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v} × ${esc(k)}`).join(" · ");
    const flav = Object.entries(fl).sort((a, b) => b[1].cups - a[1].cups).slice(0, 6);
    const maxCups = Math.max(1, ...flav.map(f => f[1].cups));

    // expense categories
    const cat = {};
    for (const e of exps) { const k = e.category || "Other"; cat[k] = (cat[k] || 0) + n(e.amount); }
    const cats = Object.entries(cat).sort((a, b) => b[1] - a[1]);

    const nothing = !S.orders.length && !S.expenses.length;

    return `
      <div class="row spread" style="margin-bottom:12px"><h2>Overview</h2>${periodSeg()}</div>
      ${nothing && (S.loaded.orders || !S.db) ? `<div class="panel empty">${cupSvg}<div><strong>No orders yet.</strong></div><div class="note">Tap <strong>+ New order</strong> to log the first sale. Add supply purchases under Expenses, and your flavors and prices under Menu.</div></div>` : ""}
      <div class="kpis" style="margin-top:12px">
        <div class="kpi hero"><div class="eyebrow">Net profit</div><div class="v num">${money(net)}</div><div class="s">${margin === null ? "Sales minus expenses" : margin + "% of sales"}</div></div>
        <div class="kpi"><div class="eyebrow">Sales</div><div class="v num">${money(sales)}</div><div class="s num">${orders.length} order${orders.length === 1 ? "" : "s"} · ${cups} cup${cups === 1 ? "" : "s"}</div></div>
        <div class="kpi"><div class="eyebrow">Expenses</div><div class="v num">${money(spent)}</div><div class="s num">${exps.length} entr${exps.length === 1 ? "y" : "ies"}</div></div>
        <div class="kpi"><div class="eyebrow">Unpaid</div><div class="v num ${unpaid > 0 ? "neg" : ""}">${money(unpaid)}</div><div class="s num">${unpaidN} order${unpaidN === 1 ? "" : "s"} to collect</div></div>
      </div>
      <div class="grid2 even" style="margin-top:16px">
        <div class="panel">${goalHtml()}</div>
        <div class="panel">${comingUpHtml()}</div>
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="panel">
          <div class="row spread" style="margin-bottom:8px"><h3 style="margin:0">Last 6 months</h3><div class="legend"><span style="--c:var(--accent)">Sales</span><span style="--c:var(--cocoa)">Expenses</span></div></div>
          ${renderChart()}
        </div>
        <div class="panel">
          <h3>This period at a glance</h3>
          <table class="mini num"><tbody>
            <tr><td>Average order</td><td>${money(avg)}</td></tr>
            ${packMix ? `<tr><td>Packs sold</td><td>${packMix}</td></tr>` : ""}
            <tr><td>Cup cost (from Menu)</td><td>${money(cogs)}</td></tr>
            <tr><td>Order profit after cup cost</td><td class="${estProfit >= 0 ? "pos" : "neg"}">${money(estProfit)}</td></tr>
            <tr><td>Profit per cup</td><td>${cups ? money(estProfit / cups) : "—"}</td></tr>
          </tbody></table>
          <p class="note" style="margin:10px 0 0">Net profit uses what you actually spent (Expenses). Order profit uses the cost per cup you set for each flavor, so you can see which orders earn the most.</p>
        </div>
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="panel">
          <h3>Best-selling flavors</h3>
          ${flav.length ? `<div class="bars">${flav.map(([k, v]) => `<div class="barrow"><span>${esc(k)}</span><span class="num muted">${v.cups} cup${v.cups === 1 ? "" : "s"}</span><div class="track"><div class="fill" style="width:${(v.cups / maxCups) * 100}%"></div></div></div>`).join("")}</div>` : `<p class="note">Flavors appear here once orders are logged for this period.</p>`}
        </div>
        <div class="panel">
          <h3>Where the money went</h3>
          ${cats.length ? `<table class="mini num"><tbody>${cats.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join("")}</tbody></table>` : `<p class="note">No expenses logged for this period.</p>`}
        </div>
      </div>
      <div class="panel" style="margin-top:16px">${customersHtml(orders)}</div>
      <div class="panel" style="margin-top:16px">
        <div class="row spread">
          <div><h3 style="margin:0">Export &amp; settings</h3><p class="note" style="margin:4px 0 0">Download a spreadsheet for taxes or your accountant.</p></div>
          <div class="row">
            <label class="note" for="currency">Currency</label>
            <select id="currency" style="width:auto" ${S.canWrite ? "" : "disabled"}>${["$", "₹", "£", "€", "AED ", "C$", "A$"].map(c => `<option value="${esc(c)}" ${S.settings.currency === c ? "selected" : ""}>${esc(c.trim())}</option>`).join("")}</select>
            <button class="btn small" type="button" data-export="orders" ${S.downloads ? "" : "hidden"}>Orders CSV</button>
            <button class="btn small" type="button" data-export="expenses" ${S.downloads ? "" : "hidden"}>Expenses CSV</button>
          </div>
        </div>
      </div>`;
  }

  // ---------- pickups, prep, goal, customers ----------
  const addDays = (s, k) => { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + k); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
  const fmtTime = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayLabel = (d) => { const t = today(); if (d === t) return "Today"; if (d === addDays(t, 1)) return "Tomorrow"; const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); };
  const custKey = (s) => (s || "").trim().toLowerCase().replace(/\s+/g, " ");

  function openPickups() {
    return S.orders.filter(o => o.pickupDate && !o.fulfilled)
      .sort((a, b) => (a.pickupDate + (a.pickupTime || "99")).localeCompare(b.pickupDate + (b.pickupTime || "99")));
  }
  function prepFor(orders) {
    const fl = {}, pk = {}; let cups = 0;
    for (const o of orders) {
      for (const i of (o.items || [])) { const k = i.name || "Flavor"; fl[k] = (fl[k] || 0) + n(i.qty); cups += n(i.qty); }
      for (const p of (o.packs || [])) { const k = p.name || "Pack"; pk[k] = (pk[k] || 0) + n(p.qty); }
    }
    return { cups, flavors: Object.entries(fl).sort((a, b) => b[1] - a[1]), packs: Object.entries(pk).sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })) };
  }
  function prepHtml(p) {
    if (!p.flavors.length) return `<p class="note" style="margin:0">No flavors picked on these orders yet.</p>`;
    return `<div class="prep">${p.flavors.map(([k, v]) => `<div class="prep-i"><span class="prep-n num">${v}</span><span>${esc(k)}</span></div>`).join("")}</div>
      ${p.packs.length ? `<p class="note num" style="margin:8px 0 0">Packs to box: ${p.packs.map(([k, v]) => `${v} × ${esc(k)}`).join(" · ")}</p>` : ""}`;
  }
  function pickupRow(o) {
    const c = orderCalc(o);
    const what = (o.items || []).map(i => `${n(i.qty)} ${i.name}`).join(", ") || (o.packs || []).map(p => `${n(p.qty)} × ${p.name}`).join(", ");
    return `<div class="mrow">
      <button type="button" class="mrow-main linklike" data-edit-order="${esc(o.id)}">
        <span class="t"><span class="time num">${esc(fmtTime(o.pickupTime) || "Any time")}</span> ${esc(o.customer || "Walk-in")} ${o.status === "unpaid" ? `<span class="chip unpaid">Unpaid · ${money(c.revenue)}</span>` : ""}</span>
        <span class="d">${esc(what || "No flavors yet")}${o.notes ? " · " + esc(o.notes) : ""}</span>
      </button>
      ${S.canWrite ? `<div class="mrow-act"><button type="button" class="btn small" data-done="${esc(o.id)}">Mark picked up</button></div>` : ""}
    </div>`;
  }

  function renderPickups() {
    const t = today();
    const list = openPickups();
    const overdue = list.filter(o => o.pickupDate < t);
    const coming = list.filter(o => o.pickupDate >= t);
    const week = coming.filter(o => o.pickupDate <= addDays(t, 6));
    const wk = prepFor(week);
    const noDate = S.orders.filter(o => !o.pickupDate && !o.fulfilled && (o.date || "") >= addDays(t, -14)).length;
    const days = {};
    coming.forEach(o => { (days[o.pickupDate] = days[o.pickupDate] || []).push(o); });
    return `
      <div class="row spread" style="margin-bottom:12px"><h2>Pickups</h2><span class="note num">${coming.length} coming up</span></div>
      ${noDate ? `<div class="banner">${noDate} recent order${noDate === 1 ? " has" : "s have"} no pickup date. Open ${noDate === 1 ? "it" : "them"} from Orders and add one so ${noDate === 1 ? "it shows" : "they show"} here.</div>` : ""}
      ${loadingOr("orders", `
      <div class="panel" style="margin-top:12px">
        <div class="row spread"><h3 style="margin:0">To make in the next 7 days</h3><span class="note num">${wk.cups} cup${wk.cups === 1 ? "" : "s"}</span></div>
        <div style="margin-top:10px">${week.length ? prepHtml(wk) : `<p class="note" style="margin:0">Nothing due this week. Add a pickup date when you log an order and it will show here.</p>`}</div>
      </div>
      ${overdue.length ? `<div class="panel overdue" style="margin-top:16px">
        <h3>Past pickup date, not marked picked up</h3>
        <div class="list">${overdue.map(o => pickupRow(o).replace('<span class="time num">', `<span class="time num">${esc(fmtDate(o.pickupDate))} · `)).join("")}</div>
      </div>` : ""}
      ${Object.keys(days).sort().map(d => { const p = prepFor(days[d]); return `
        <div class="panel" style="margin-top:16px">
          <div class="row spread"><h3 style="margin:0">${esc(dayLabel(d))}</h3><span class="note num">${days[d].length} order${days[d].length === 1 ? "" : "s"} · ${p.cups} cups</span></div>
          <div style="margin:10px 0 4px">${prepHtml(p)}</div>
          <div class="list">${days[d].map(pickupRow).join("")}</div>
        </div>`; }).join("")}`)}`;
  }

  function goalHtml() {
    const g = S.settings.goal || {};
    const now = new Date(); const mk = today().slice(0, 7);
    const monthName = now.toLocaleDateString(undefined, { month: "long" });
    const mo = S.orders.filter(o => monthKey(o.date) === mk);
    let sales = 0, cups = 0; mo.forEach(o => { const c = orderCalc(o); sales += c.revenue; cups += c.cups; });
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const left = dim - now.getDate() + 1;
    const head = `<div class="row spread"><h3 style="margin:0">${esc(monthName)} goal</h3>${S.canWrite ? `<button type="button" class="btn small" data-goal>${g.sales || g.cups ? "Edit goal" : "Set goal"}</button>` : ""}</div>`;
    if (!n(g.sales) && !n(g.cups)) return head + `<p class="note" style="margin:8px 0 0">Set a sales or cups target for the month and track how close you are.</p>`;
    const bar = (label, have, want, fmt) => {
      const pct = Math.min(100, want ? have / want * 100 : 0); const rest = Math.max(0, want - have);
      return `<div class="goal">
        <div class="row spread"><span class="eyebrow">${label}</span><span class="num"><strong>${fmt(have)}</strong> <span class="muted">of ${fmt(want)}</span></span></div>
        <div class="gtrack"><div class="gfill ${pct >= 100 ? "met" : ""}" style="width:${pct}%"></div></div>
        <div class="note num">${pct >= 100 ? "Goal reached 🎉" : `${fmt(rest)} to go · about ${fmt(Math.ceil(rest / left * 100) / 100)} a day for ${left} day${left === 1 ? "" : "s"}`}</div>
      </div>`;
    };
    const cupFmt = (v) => `${Math.ceil(v)} cups`;
    return head + `<div style="display:grid;gap:14px;margin-top:10px">
      ${n(g.sales) ? bar("Sales", sales, n(g.sales), money) : ""}
      ${n(g.cups) ? bar("Cups", cups, n(g.cups), cupFmt) : ""}
    </div>`;
  }

  function comingUpHtml() {
    const t = today();
    const list = openPickups().filter(o => o.pickupDate >= t).slice(0, 3);
    const over = openPickups().filter(o => o.pickupDate < t).length;
    return `<div class="row spread"><h3 style="margin:0">Coming up</h3><button type="button" class="btn small" data-go="pickups">All pickups</button></div>
      ${over ? `<p class="note neg" style="margin:8px 0 0">${over} past pickup${over === 1 ? "" : "s"} not marked picked up</p>` : ""}
      ${list.length ? `<div class="list" style="margin-top:6px">${list.map(o => `<button type="button" class="item" data-edit-order="${esc(o.id)}">
          <span class="t">${esc(o.customer || "Walk-in")}</span><span class="a num">${esc(o.pickupDate === t ? "Today" : o.pickupDate === addDays(t, 1) ? "Tomorrow" : fmtDate(o.pickupDate))}</span>
          <span class="d">${esc((o.items || []).map(i => `${n(i.qty)} ${i.name}`).join(", ") || "No flavors yet")}</span><span class="p num muted">${esc(fmtTime(o.pickupTime))}</span>
        </button>`).join("")}</div>` : `<p class="note" style="margin:8px 0 0">No pickups scheduled. Add a pickup date when you log an order.</p>`}`;
  }

  function customersHtml(orders) {
    const all = {};
    for (const o of S.orders) { const k = custKey(o.customer); if (k) all[k] = (all[k] || 0) + 1; }
    const per = {}; let walk = 0;
    for (const o of orders) {
      const k = custKey(o.customer); if (!k) { walk++; continue; }
      const c = orderCalc(o);
      per[k] = per[k] || { name: o.customer.trim(), orders: 0, spent: 0, cups: 0 };
      per[k].orders++; per[k].spent += c.revenue; per[k].cups += c.cups;
    }
    const keys = Object.keys(per);
    const repeat = keys.filter(k => all[k] >= 2).length;
    const top = keys.map(k => [k, per[k]]).sort((a, b) => b[1].spent - a[1].spent).slice(0, 5);
    const named = orders.length - walk;
    return `<h3>Customers</h3>
      <div class="minis">
        <div><div class="eyebrow">Customers</div><div class="mv num">${keys.length}</div></div>
        <div><div class="eyebrow">Came back</div><div class="mv num">${repeat}${keys.length ? ` <span class="muted mvs">${Math.round(repeat / keys.length * 100)}%</span>` : ""}</div></div>
        <div><div class="eyebrow">Orders each</div><div class="mv num">${keys.length ? (named / keys.length).toFixed(1) : "—"}</div></div>
      </div>
      ${top.length ? `<table class="mini num" style="margin-top:10px"><tbody>${top.map(([k, v]) => `<tr><td>${esc(v.name)} ${all[k] >= 2 ? `<span class="chip paid">Repeat</span>` : ""}<div class="note">${all[k]} order${all[k] === 1 ? "" : "s"} all-time · ${v.cups} cups this period</div></td><td>${money(v.spent)}</td></tr>`).join("")}</tbody></table>` : `<p class="note">Add the customer's name on each order to see who your regulars are.</p>`}
      ${walk ? `<p class="note" style="margin:8px 0 0">${walk} order${walk === 1 ? "" : "s"} without a customer name.</p>` : ""}`;
  }

  function goalForm() {
    const g = S.settings.goal || {};
    openSheet(`
      <div class="row spread"><h2>Monthly goal</h2><button type="button" class="btn small" data-close>Close</button></div>
      <p class="note" style="margin:0">Used every month until you change it. Leave a box empty to skip it.</p>
      <div class="fgrid">
        <div class="field"><label for="g-sales">Sales target</label><input id="g-sales" type="number" min="0" step="1" inputmode="decimal" value="${esc(g.sales || "")}" placeholder="500"></div>
        <div class="field"><label for="g-cups">Cups target</label><input id="g-cups" type="number" min="0" step="1" inputmode="numeric" value="${esc(g.cups || "")}" placeholder="100"></div>
      </div>
      <div class="sheet-actions"><span></span><button type="submit" class="btn primary">Save goal</button></div>`, (f) => {
      $("[data-close]", f).addEventListener("click", closeSheet);
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const goal = { sales: r2(n($("#g-sales", f).value)), cups: Math.round(n($("#g-cups", f).value)) };
        closeSheet();
        S.settings = { ...S.settings, goal }; render();
        await write("settings/main", { ...S.settings }, "Goal saved");
      });
    });
  }

  async function markDone(id) {
    const o = S.orders.find(x => x.id === id); if (!o || !S.db) return;
    try { await S.db.doc("orders/" + id).update({ fulfilled: true, fulfilledAt: Date.now() }); toast(`${o.customer || "Order"} marked picked up`); }
    catch (e) { handleWriteError(e); }
  }

  function renderChart() {
    const now = new Date(); const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
    const data = months.map(k => {
      const s = S.orders.filter(o => monthKey(o.date) === k).reduce((a, o) => a + orderCalc(o).revenue, 0);
      const e = S.expenses.filter(x => monthKey(x.date) === k).reduce((a, x) => a + n(x.amount), 0);
      return { k, s, e, net: s - e };
    });
    const max = Math.max(...data.map(d => Math.max(d.s, d.e)), 0);
    const nice = (v) => { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
    const top = nice(max);
    const W = 560, H = 220, L = 52, R = 8, T = 10, B = 44;
    const cw = (W - L - R) / data.length; const bw = Math.min(22, cw / 3);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const c = S.settings.currency || "$";
    const short = (v) => c.trim() + (v >= 1000 ? (v / 1000).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "k" : Math.round(v));
    let g = "";
    for (let i = 0; i <= 4; i++) { const v = top * i / 4; const yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(short(v))}</text>`; }
    data.forEach((d, i) => {
      const cx = L + cw * i + cw / 2;
      const hs = (H - T - B) - (y(d.s) - T), he = (H - T - B) - (y(d.e) - T);
      g += `<rect x="${cx - bw - 1}" y="${y(d.s)}" width="${bw}" height="${Math.max(0, hs)}" rx="3" fill="var(--accent)"><title>Sales ${esc(money(d.s))}</title></rect>`;
      g += `<rect x="${cx + 1}" y="${y(d.e)}" width="${bw}" height="${Math.max(0, he)}" rx="3" fill="var(--cocoa)"><title>Expenses ${esc(money(d.e))}</title></rect>`;
      g += `<text x="${cx}" y="${H - B + 16}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${esc(monthLabel(d.k))}</text>`;
      g += `<text x="${cx}" y="${H - B + 32}" text-anchor="middle" font-size="11" fill="${d.net >= 0 ? "var(--good)" : "var(--bad)"}">${d.s || d.e ? esc((d.net >= 0 ? "+" : "−") + short(Math.abs(d.net))) : ""}</text>`;
    });
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Monthly sales and expenses">${g}</svg></div><p class="note" style="margin:4px 0 0">Number under each month is net profit.</p>`;
  }

  function renderOrders() {
    const q = S.q.toLowerCase();
    const list = S.orders.filter(o => inPeriod(o.date, S.period))
      .filter(o => !q || (o.customer || "").toLowerCase().includes(q) || (o.items || []).some(i => (i.name || "").toLowerCase().includes(q)) || (o.notes || "").toLowerCase().includes(q))
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
    let tot = 0, prof = 0; list.forEach(o => { const c = orderCalc(o); tot += c.revenue; prof += c.profit; });
    return `
      <div class="row spread" style="margin-bottom:12px"><h2>Orders</h2>${periodSeg()}</div>
      <div class="panel">
        <div class="toolbar" style="margin-bottom:6px">
          <input class="search" id="q" type="text" placeholder="Search customer, flavor or note" value="${esc(S.q)}" aria-label="Search orders">
          <span class="note num">${list.length} shown · ${money(tot)} sales · ${money(prof)} order profit</span>
        </div>
        ${loadingOr("orders", list.length ? `<div class="list">${list.map(o => {
          const c = orderCalc(o);
          const what = [(o.packs || []).map(p => `${n(p.qty)} × ${p.name}`).join(", "), (o.items || []).map(i => `${n(i.qty)} ${i.name || "?"}`).join(", ")].filter(Boolean).join(" · ");
          return `<button class="item" type="button" data-edit-order="${esc(o.id)}">
            <span class="t">${esc(o.customer || "Walk-in")} <span class="chip ${o.status === "unpaid" ? "unpaid" : "paid"}">${o.status === "unpaid" ? "Unpaid" : "Paid"}</span>${o.fulfilled ? ` <span class="chip ex">Picked up</span>` : ""}</span>
            <span class="a num">${money(c.revenue)}</span>
            <span class="d">${esc(fmtDate(o.date))}${o.pickupDate ? ` · pickup ${esc(fmtDate(o.pickupDate))}${o.pickupTime ? " " + esc(fmtTime(o.pickupTime)) : ""}` : ""} · ${esc(what || "No items")}</span>
            <span class="p num ${c.profit >= 0 ? "pos" : "neg"}">${money(c.profit, true)} profit</span>
          </button>`;
        }).join("")}</div>` : `<div class="empty">${cupSvg}<div>${S.orders.length ? "No orders match this period or search." : "No orders yet. Tap <strong>+ New order</strong> to log one."}</div></div>`)}
      </div>`;
  }

  function renderExpenses() {
    const list = S.expenses.filter(e => inPeriod(e.date, S.period)).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
    const tot = list.reduce((a, e) => a + n(e.amount), 0);
    return `
      <div class="row spread" style="margin-bottom:12px"><h2>Expenses</h2>${periodSeg()}</div>
      <div class="panel">
        <div class="toolbar" style="margin-bottom:6px"><span class="note num">${list.length} entr${list.length === 1 ? "y" : "ies"} · ${money(tot)} spent</span></div>
        ${loadingOr("expenses", list.length ? `<div class="list">${list.map(e => `<button class="item" type="button" data-edit-exp="${esc(e.id)}">
            <span class="t">${esc(e.vendor || e.category || "Expense")}</span>
            <span class="a num">${money(n(e.amount))}</span>
            <span class="d">${esc(fmtDate(e.date))} · ${esc(e.category || "Other")}${e.notes ? " · " + esc(e.notes) : ""}</span><span></span>
          </button>`).join("")}</div>` : `<div class="empty">${cupSvg}<div>${S.expenses.length ? "No expenses in this period." : "No expenses yet. Log ingredient runs, cups, lids, spoons and labels here."}</div></div>`)}
      </div>`;
  }

  function renderMenu() {
    const W = S.canWrite;
    const packs = sortedPacks();
    const list = [...S.products].sort(byName);
    if (W && S.menuDraft) {
      return `
      <div class="row spread" style="margin-bottom:12px"><h2>Flavor costs</h2>
        <div class="row"><button type="button" class="btn" data-menu="cancel">Cancel</button><button type="button" class="btn primary" data-menu="save">Save all</button></div></div>
      <div class="panel">
        <p class="note" style="margin:0 0 10px">Change any flavor name or what one cup costs to make, then tap <strong>Save all</strong>.</p>
        <div class="bulk">
          <div class="bulk-row bulk-head"><span>Flavor</span><span>Cost / cup</span></div>
          ${list.map(p => { const d = S.menuDraft[p.id] || {};
            return `<div class="bulk-row" data-id="${esc(p.id)}">
              <input type="text" data-bulk="name" value="${esc(d.name)}" aria-label="Flavor name">
              <input type="number" data-bulk="cost" min="0" step="0.01" inputmode="decimal" value="${esc(d.cost)}" aria-label="Cost per cup">
            </div>`; }).join("")}
        </div></div>`;
    }
    const armBtn = (key, extra) => `<button type="button" class="btn small danger ${S.armed === key ? "armed" : ""}" ${extra}>${S.armed === key ? "Tap again" : "Delete"}</button>`;
    return `
      <div class="row spread" style="margin-bottom:12px"><h2>Menu</h2></div>
      <div class="panel">
        <div class="row spread"><h3 style="margin:0">Pack sizes &amp; prices</h3>${W ? `<button type="button" class="btn small primary" data-menu="addpack">+ Add pack</button>` : ""}</div>
        <p class="note" style="margin:4px 0 8px">What customers pay. New orders are priced by the packs they buy, and customers can mix flavors inside a pack.</p>
        ${loadingOr("packs", packs.length ? `<div class="list">${packs.map(p => `<div class="mrow">
            <div class="mrow-main"><span class="t">${esc(p.name)}</span>
              <span class="d num">${n(p.cups)} cup${n(p.cups) === 1 ? "" : "s"} for ${money(n(p.price))} · ${money(n(p.cups) ? n(p.price) / n(p.cups) : 0)} a cup</span></div>
            ${W ? `<div class="mrow-act"><button type="button" class="btn small" data-prod-act="editpack" data-id="${esc(p.id)}">Edit</button>${armBtn("pack:" + p.id, `data-prod-act="delpack" data-id="${esc(p.id)}"`)}</div>` : ""}
          </div>`).join("")}</div>` : `<div class="empty">No pack sizes yet. Tap <strong>+ Add pack</strong>, for example 3 cups for $18.</div>`)}
      </div>
      <div class="panel">
        <div class="row spread"><h3 style="margin:0">Flavors</h3>${W ? `<div class="row">${list.length ? `<button type="button" class="btn small" data-menu="bulk">Edit all costs</button>` : ""}<button type="button" class="btn small primary" data-menu="add">+ Add flavor</button></div>` : ""}</div>
        <p class="note" style="margin:4px 0 8px">Set what one cup costs you to make (ingredients plus cup, lid and spoon) so the profit on each order is accurate. Hidden flavors stay in past orders but aren't offered on new ones.</p>
        ${loadingOr("products", list.length ? `<div class="list">${list.map(p => {
          const hidden = p.active === false; const c = n(p.cost);
          const prof = packs.map(k => `${esc(k.name)} ${money(n(k.price) - n(k.cups) * c)}`).join(" · ");
          return `<div class="mrow ${hidden ? "is-hidden" : ""}">
            <div class="mrow-main">
              <span class="t">${esc(p.name)} ${hidden ? `<span class="chip ex">Hidden</span>` : ""} ${c ? "" : `<span class="chip unpaid">Cost not set</span>`}</span>
              <span class="d num">Costs ${money(c)} a cup${prof ? ` · profit per pack: ${prof}` : ""}</span>
            </div>
            ${W ? `<div class="mrow-act">
              <button type="button" class="btn small" data-prod-act="edit" data-id="${esc(p.id)}">Edit</button>
              <button type="button" class="btn small" data-prod-act="dup" data-id="${esc(p.id)}">Copy</button>
              <button type="button" class="btn small" data-prod-act="toggle" data-id="${esc(p.id)}">${hidden ? "Show" : "Hide"}</button>
              ${armBtn("prod:" + p.id, `data-prod-act="del" data-id="${esc(p.id)}"`)}
            </div>` : ""}
          </div>`;
        }).join("")}</div>` : `<div class="empty">${cupSvg}<div>No flavors yet. Tap <strong>+ Add flavor</strong>.</div></div>`)}
      </div>`;
  }

  function armOrRun(key, fn) {
    if (S.armed !== key) { S.armed = key; render(); clearTimeout(armOrRun._t); armOrRun._t = setTimeout(() => { S.armed = null; render(); }, 3000); return; }
    S.armed = null; fn();
  }

  async function menuAction(act, id) {
    if (act === "add") { productForm(); return; }
    if (act === "addpack") { packForm(); return; }
    if (act === "bulk") { S.menuDraft = {}; S.products.forEach(x => { S.menuDraft[x.id] = { name: x.name || "", cost: x.cost ?? "" }; }); render(); return; }
    if (act === "cancel") { S.menuDraft = null; render(); return; }
    if (act === "save") {
      const changes = S.products.filter(x => { const d = S.menuDraft[x.id]; return d && (d.name.trim() !== (x.name || "") || r2(n(d.cost)) !== r2(n(x.cost))); });
      if (changes.some(x => !S.menuDraft[x.id].name.trim())) { toast("Every flavor needs a name"); return; }
      const drafts = S.menuDraft; S.menuDraft = null; render();
      if (!changes.length) { toast("No changes"); return; }
      for (const x of changes) {
        const d = drafts[x.id];
        try { await S.db.doc("products/" + x.id).set(flavorDoc(x, { name: d.name.trim(), cost: r2(n(d.cost)) })); }
        catch (e) { handleWriteError(e); return; }
      }
      toast(changes.length === 1 ? "1 flavor updated" : changes.length + " flavors updated");
      return;
    }
    const k = S.packs.find(x => x.id === id);
    if (act === "editpack" && k) { packForm(k); return; }
    if (act === "delpack" && k) { armOrRun("pack:" + id, () => remove("packs/" + id, "Pack deleted")); return; }
    const p = S.products.find(x => x.id === id);
    if (!p) return;
    if (act === "edit") productForm(p);
    else if (act === "dup") productForm(null, { name: p.name + " (copy)", cost: p.cost, active: true });
    else if (act === "toggle") await write("products/" + p.id, flavorDoc(p, { active: p.active === false }), p.active === false ? "Back on the menu" : "Hidden from new orders");
    else if (act === "del") armOrRun("prod:" + id, () => remove("products/" + id, "Flavor deleted"));
  }
  const flavorDoc = (p, patch) => ({ name: p.name, cost: n(p.cost), active: p.active !== false, ...patch, updatedAt: Date.now() });

  // ---------- sheets (forms) ----------
  function openSheet(html, onMount) {
    const host = $("#sheetHost");
    host.innerHTML = `<div class="overlay" id="ov"><form class="sheet" id="sheet" novalidate>${html}</form></div>`;
    $("#ov").addEventListener("click", (e) => { if (e.target.id === "ov") closeSheet(); });
    onMount && onMount($("#sheet"));
    const first = $("#sheet input, #sheet select"); first && first.focus({ preventScroll: true });
  }
  function closeSheet() { $("#sheetHost").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#ov")) closeSheet(); });

  function armDelete(btn, fn) {
    btn.addEventListener("click", () => {
      if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Delete"; }, 3000); return; }
      fn();
    });
  }

  async function write(path, data, msg) {
    if (!S.db) { toast("Saving isn't available in this view"); return false; }
    try { await S.db.doc(path).set(data); toast(msg); return true; }
    catch (e) { handleWriteError(e); return false; }
  }
  async function remove(path, msg) {
    if (!S.db) return;
    try { await S.db.doc(path).delete(); toast(msg); } catch (e) { handleWriteError(e); }
  }
  function handleWriteError(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.canWrite = false; setTab(S.tab); showStatus("You can view this ledger but not change it. Ask the owner for Contributor or Editor access."); }
    else if (code === "quota_exceeded") showStatus("The ledger is full. Delete some old entries to add new ones.");
    else toast("Couldn't save. Check your connection and try again.");
  }

  const byName = (a, b) => (a.name || "").localeCompare(b.name || "");
  const sortedPacks = () => [...S.packs].sort((a, b) => n(a.cups) - n(b.cups) || n(a.price) - n(b.price));
  function packOptions(sel) {
    return `<option value="">Choose pack…</option>` + sortedPacks().map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.name)} · ${money(n(p.price))}</option>`).join("");
  }
  function flavorOptions(sel) {
    const ps = S.products.filter(p => p.active !== false || p.id === sel).sort(byName);
    return `<option value="">Choose flavor…</option>` + ps.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  }
  const packLine = (p) => p ? { packId: p.id, name: p.name, cups: n(p.cups), price: n(p.price), qty: 1 } : { packId: "", name: "", cups: 0, price: 0, qty: 1 };

  function orderForm(existing) {
    const o = existing ? JSON.parse(JSON.stringify(existing)) : { date: today(), customer: "", packs: [], items: [], deliveryFee: "", discount: "", payment: "Payment app", status: "paid", notes: "" };
    o.packs = Array.isArray(o.packs) ? o.packs : [];
    o.items = Array.isArray(o.items) ? o.items : [];
    const legacy = !!existing && !o.packs.length && o.items.some(i => n(i.price) > 0);
    if (!existing) { const sp = sortedPacks(); o.packs.push(packLine(sp[0])); }
    if (!o.items.length) o.items.push({ productId: "", name: "", qty: "" });

    const pLine = (pk, i) => `<div class="line" data-i="${i}">
        <select data-k="packId" aria-label="Pack">${packOptions(pk.packId)}</select>
        <input type="number" data-k="qty" min="0" step="1" inputmode="numeric" value="${esc(pk.qty)}" aria-label="How many packs">
        <span class="num lt">${money(n(pk.qty) * n(pk.price))}</span>
        <button type="button" class="x" data-rmp="${i}" aria-label="Remove pack">×</button>
      </div>`;
    const fLine = (it, i) => `<div class="line" data-i="${i}">
        ${it.productId || !legacy ? `<select data-k="productId" aria-label="Flavor">${flavorOptions(it.productId)}</select>` : `<input type="text" value="${esc(it.name)}" disabled>`}
        <input type="number" data-k="qty" min="0" step="1" inputmode="numeric" value="${esc(it.qty)}" placeholder="cups" aria-label="Cups of this flavor">
        <span class="num lt muted">${it.productId || it.cost ? money(n(it.qty) * n(it.cost)) : ""}</span>
        <button type="button" class="x" data-rmf="${i}" aria-label="Remove flavor">×</button>
      </div>`;

    openSheet(`
      <div class="row spread"><h2>${existing ? "Edit order" : "New order"}</h2><button type="button" class="btn small" data-close>Close</button></div>
      <div class="fgrid">
        <div class="field"><label for="o-customer">Customer</label><input id="o-customer" type="text" list="custlist" autocomplete="off" value="${esc(o.customer)}" placeholder="Name or event"></div>
        <div class="field"><label for="o-date">Order date</label><input id="o-date" type="date" value="${esc(o.date)}"></div>
        <div class="field"><label for="o-pdate">Pickup date</label><input id="o-pdate" type="date" value="${esc(o.pickupDate || "")}"></div>
        <div class="field"><label for="o-ptime">Pickup time</label><input id="o-ptime" type="time" value="${esc(o.pickupTime || "")}"></div>
        ${existing ? `<div class="field full"><label for="o-done">Picked up?</label><select id="o-done"><option value="0" ${o.fulfilled ? "" : "selected"}>Not yet</option><option value="1" ${o.fulfilled ? "selected" : ""}>Yes, picked up or delivered</option></select></div>` : ""}
      </div>
      <datalist id="custlist">${[...new Set(S.orders.map(x => (x.customer || "").trim()).filter(Boolean))].sort().map(c => `<option value="${esc(c)}"></option>`).join("")}</datalist>
      ${legacy ? `<p class="banner" style="margin:0">This order was logged at a per-cup price, so its total stays ${money(orderCalc(o).subtotal)} unless you add a pack below.</p>` : ""}
      <div class="field"><label>Packs <span class="muted" style="font-weight:400">· pack · how many · total</span></label>
        <div class="lines" id="plines"></div>
        <div>${S.packs.length ? `<button type="button" class="btn small" id="addPack">+ Add pack</button>` : `<span class="note">Add pack sizes on the Menu tab first.</span>`}</div></div>
      <div class="field"><label>Flavors <span class="muted" style="font-weight:400">· which flavors, and how many cups of each</span></label>
        <div class="lines" id="flines"></div>
        <div class="row spread"><button type="button" class="btn small" id="addFlavor">+ Add flavor</button><span class="note num" id="fhint"></span></div></div>
      <div class="fgrid">
        <div class="field"><label for="o-fee">Delivery fee charged</label><input id="o-fee" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(o.deliveryFee)}" placeholder="0.00"></div>
        <div class="field"><label for="o-disc">Discount given</label><input id="o-disc" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(o.discount)}" placeholder="0.00"></div>
        <div class="field"><label for="o-pay">Paid by</label><select id="o-pay">${PAY.map(p => `<option ${o.payment === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
        <div class="field"><label for="o-status">Status</label><select id="o-status"><option value="paid" ${o.status !== "unpaid" ? "selected" : ""}>Paid</option><option value="unpaid" ${o.status === "unpaid" ? "selected" : ""}>Not paid yet</option></select></div>
        <div class="field full"><label for="o-notes">Notes</label><textarea id="o-notes" placeholder="Pickup time, allergies, event…">${esc(o.notes)}</textarea></div>
      </div>
      <div class="sumbox num" id="osum"></div>
      <div class="sheet-actions">
        ${existing ? `<button type="button" class="btn danger" id="del">Delete</button>` : "<span></span>"}
        <button type="submit" class="btn primary">${existing ? "Save changes" : "Save order"}</button>
      </div>`, (f) => {
      const pEl = $("#plines", f), fEl = $("#flines", f);
      const draw = () => { pEl.innerHTML = o.packs.map(pLine).join(""); fEl.innerHTML = o.items.map(fLine).join(""); sum(); };
      const sum = () => {
        o.deliveryFee = $("#o-fee", f).value; o.discount = $("#o-disc", f).value;
        const c = orderCalc(o);
        pEl.querySelectorAll(".line").forEach((row, i) => { const pk = o.packs[i]; row.querySelector(".lt").textContent = money(n(pk.qty) * n(pk.price)); });
        fEl.querySelectorAll(".line").forEach((row, i) => { const it = o.items[i]; const lt = row.querySelector(".lt"); lt.textContent = it.productId || it.cost ? money(n(it.qty) * n(it.cost)) : ""; });
        const h = $("#fhint", f);
        if (c.packCups) { h.textContent = c.flavorCups === c.packCups ? `All ${c.packCups} cups picked ✓` : `${c.flavorCups} of ${c.packCups} cups picked`; h.className = "note num " + (c.flavorCups === c.packCups ? "pos" : c.flavorCups > c.packCups ? "neg" : ""); }
        else h.textContent = "";
        $("#osum", f).innerHTML = `${o.packs.filter(p => p.packId && n(p.qty)).map(p => `<div><span>${n(p.qty)} × ${esc(p.name)}</span><span>${money(n(p.qty) * n(p.price))}</span></div>`).join("") || (legacy ? `<div><span>${c.flavorCups} cups</span><span>${money(c.subtotal)}</span></div>` : "")}
          ${n(o.deliveryFee) ? `<div><span>Delivery</span><span>${money(n(o.deliveryFee))}</span></div>` : ""}
          ${n(o.discount) ? `<div><span>Discount</span><span>${money(-n(o.discount))}</span></div>` : ""}
          <div class="big"><span>Order total</span><span>${money(c.revenue)}</span></div>
          <div><span class="muted">Cost of ${c.flavorCups} cup${c.flavorCups === 1 ? "" : "s"}</span><span class="muted">${money(-c.cost)}</span></div>
          <div><span><strong>Profit</strong></span><strong class="${c.profit >= 0 ? "pos" : "neg"}">${money(c.profit)}</strong></div>`;
      };
      draw();
      pEl.addEventListener("input", (e) => {
        const row = e.target.closest(".line"); if (!row) return; const pk = o.packs[+row.dataset.i];
        if (e.target.dataset.k === "packId") { const p = S.packs.find(x => x.id === e.target.value); Object.assign(pk, packLine(p), { qty: pk.qty }); }
        else pk.qty = e.target.value;
        sum();
      });
      fEl.addEventListener("input", (e) => {
        const row = e.target.closest(".line"); if (!row) return; const it = o.items[+row.dataset.i];
        if (e.target.dataset.k === "productId") {
          const p = S.products.find(x => x.id === e.target.value);
          it.productId = p ? p.id : ""; it.name = p ? p.name : ""; it.cost = p ? n(p.cost) : 0; it.price = 0;
          if (p && (it.qty === "" || it.qty == null)) {
            const c = orderCalc(o); const left = c.packCups - c.flavorCups;
            if (left > 0) { it.qty = left; row.querySelector('[data-k="qty"]').value = left; }
          }
        } else it.qty = e.target.value;
        sum();
      });
      pEl.addEventListener("click", (e) => { const b = e.target.closest("[data-rmp]"); if (!b) return; o.packs.splice(+b.dataset.rmp, 1); draw(); });
      fEl.addEventListener("click", (e) => { const b = e.target.closest("[data-rmf]"); if (!b) return; o.items.splice(+b.dataset.rmf, 1); if (!o.items.length) o.items.push({ productId: "", name: "", qty: "" }); draw(); });
      $("#addPack", f)?.addEventListener("click", () => { o.packs.push(packLine(sortedPacks()[0])); draw(); });
      $("#addFlavor", f).addEventListener("click", () => { o.items.push({ productId: "", name: "", qty: "" }); draw(); });
      ["#o-fee", "#o-disc"].forEach(s => $(s, f).addEventListener("input", sum));
      $("[data-close]", f).addEventListener("click", closeSheet);
      if (existing) armDelete($("#del", f), async () => { closeSheet(); await remove("orders/" + existing.id, "Order deleted"); });
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const packs = o.packs.filter(p => p.packId && n(p.qty) > 0).map(p => ({ packId: p.packId, name: p.name, cups: n(p.cups), price: r2(n(p.price)), qty: n(p.qty) }));
        const items = o.items.filter(i => (i.productId || i.name) && n(i.qty) > 0).map(i => ({ productId: i.productId || "", name: (i.name || "").trim() || "Flavor", qty: n(i.qty), cost: r2(n(i.cost)), price: r2(n(i.price)) }));
        if (!packs.length && !(legacy && items.length)) { toast("Add at least one pack"); return; }
        const data = {
          date: $("#o-date", f).value || today(), customer: $("#o-customer", f).value.trim(), packs, items,
          pickupDate: $("#o-pdate", f).value, pickupTime: $("#o-ptime", f).value, fulfilled: existing ? $("#o-done", f).value === "1" : false,
          deliveryFee: r2(n($("#o-fee", f).value)), discount: r2(n($("#o-disc", f).value)),
          payment: $("#o-pay", f).value, status: $("#o-status", f).value, notes: $("#o-notes", f).value.trim(),
          createdAt: existing?.createdAt || Date.now(), updatedAt: Date.now(),
        };
        const id = existing?.id || S.db?.collection("orders").doc().id;
        if (!id) { toast("Saving isn't available in this view"); return; }
        closeSheet();
        await write("orders/" + id, data, existing ? "Order updated" : "Order saved");
      });
    });
  }

      <div class="fgrid">
        <div class="field"><label for="e-amount">Amount</label><input id="e-amount" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.amount)}" placeholder="0.00" required></div>

        <div class="field"><label for="e-vendor">Where / what</label><input id="e-vendor" type="text" value="${esc(x.vendor)}" placeholder="e.g. Costco – cream cheese"></div>

      <div class="sheet-actions">

        const id = existing?.id || S.db?.collection("expenses").doc().id;
        if (!id) { toast("Saving isn't available in this view"); return; }
        closeSheet();
        await write("expenses/" + id, data, existing ? "Expense updated" : "Expense saved");
      });

  }

  function productForm(existing, prefill) {
    const p = existing || prefill || { name: "", cost: "", active: true };
    openSheet(`
      <div class="row spread"><h2>${existing ? "Edit flavor" : "New flavor"}</h2><button type="button" class="btn small" data-close>Close</button></div>
      <div class="fgrid">
        <div class="field full"><label for="p-name">Flavor name</label><input id="p-name" type="text" value="${esc(p.name)}" placeholder="e.g. Mango Cheesecake Cup"></div>
        <div class="field"><label for="p-cost">Cost to make one cup</label><input id="p-cost" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(p.cost)}" placeholder="0.00"></div>
        <div class="field"><label for="p-active">Offer on new orders</label><select id="p-active"><option value="1" ${p.active !== false ? "selected" : ""}>Yes</option><option value="0" ${p.active === false ? "selected" : ""}>No, hide it</option></select></div>
      </div>
      <div class="sumbox num" id="psum"></div>
      <div class="sheet-actions">
        ${existing ? `<button type="button" class="btn danger" id="del">Delete</button>` : "<span></span>"}
        <button type="submit" class="btn primary">${existing ? "Save changes" : "Save flavor"}</button>
      </div>`, (f) => {
      const sum = () => {
        const c = n($("#p-cost", f).value);
        const rows = sortedPacks().map(k => { const m = n(k.price) - n(k.cups) * c; return `<div><span>${esc(k.name)} at ${money(n(k.price))}</span><strong class="${m >= 0 ? "pos" : "neg"}">${money(m)} profit</strong></div>`; }).join("");
        $("#psum", f).innerHTML = rows || `<div><span class="muted">Add pack sizes on the Menu tab to see profit per pack.</span></div>`;
      };
      sum(); $("#p-cost", f).addEventListener("input", sum);
      $("[data-close]", f).addEventListener("click", closeSheet);
      if (existing) armDelete($("#del", f), async () => { closeSheet(); await remove("products/" + existing.id, "Flavor deleted"); });
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("#p-name", f).value.trim(); if (!name) { toast("Give the flavor a name"); return; }
        const data = { name, cost: r2(n($("#p-cost", f).value)), active: $("#p-active", f).value === "1", updatedAt: Date.now() };
        const id = existing?.id || S.db?.collection("products").doc().id;
        if (!id) { toast("Saving isn't available in this view"); return; }
        closeSheet();
        await write("products/" + id, data, existing ? "Flavor updated" : "Flavor added");
      });
    });
  }

  function packForm(existing) {
    const p = existing || { name: "", cups: "", price: "" };
    openSheet(`
      <div class="row spread"><h2>${existing ? "Edit pack" : "New pack"}</h2><button type="button" class="btn small" data-close>Close</button></div>
      <div class="fgrid">
        <div class="field"><label for="k-cups">Cups in pack</label><input id="k-cups" type="number" min="1" step="1" inputmode="numeric" value="${esc(p.cups)}" placeholder="3"></div>
        <div class="field"><label for="k-price">Price</label><input id="k-price" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(p.price)}" placeholder="18.00"></div>
        <div class="field full"><label for="k-name">Name <span class="muted" style="font-weight:400">· optional</span></label><input id="k-name" type="text" value="${esc(p.name)}" placeholder="3 cups"></div>
      </div>
      <div class="sumbox num" id="ksum"></div>
      <div class="sheet-actions">
        ${existing ? `<button type="button" class="btn danger" id="del">Delete</button>` : "<span></span>"}
        <button type="submit" class="btn primary">${existing ? "Save changes" : "Save pack"}</button>
      </div>`, (f) => {
      const sum = () => { const c = n($("#k-cups", f).value), pr = n($("#k-price", f).value); $("#ksum", f).innerHTML = `<div><span>Price per cup</span><strong>${c ? money(pr / c) : "—"}</strong></div>`; };
      sum(); ["#k-cups", "#k-price"].forEach(s => $(s, f).addEventListener("input", sum));
      $("[data-close]", f).addEventListener("click", closeSheet);
      if (existing) armDelete($("#del", f), async () => { closeSheet(); await remove("packs/" + existing.id, "Pack deleted"); });
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const cups = Math.round(n($("#k-cups", f).value)); const price = r2(n($("#k-price", f).value));
        if (cups < 1) { toast("Enter how many cups are in the pack"); return; }
        if (price <= 0) { toast("Enter the pack price"); return; }
        const name = $("#k-name", f).value.trim() || `${cups} cup${cups === 1 ? "" : "s"}`;
        const id = existing?.id || S.db?.collection("packs").doc().id;
        if (!id) { toast("Saving isn't available in this view"); return; }
        closeSheet();
        await write("packs/" + id, { name, cups, price, updatedAt: Date.now() }, existing ? "Pack updated" : "Pack added");
      });
    });
  }

  // ---------- export ----------
  const csvCell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  async function exportCsv(kind) {
    if (!S.downloads) return;
    let rows;
    if (kind === "orders") {
      rows = [["Date", "Customer", "Packs", "Flavors", "Cups", "Subtotal", "Delivery fee", "Discount", "Total", "Cup cost", "Profit", "Paid by", "Status", "Pickup date", "Pickup time", "Picked up", "Notes"]];
      [...S.orders].sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(o => { const c = orderCalc(o); rows.push([o.date, o.customer, (o.packs || []).map(p => `${n(p.qty)}x ${p.name} @ ${n(p.price)}`).join("; "), (o.items || []).map(i => `${n(i.qty)} ${i.name}`).join("; "), c.cups, r2(c.subtotal), n(o.deliveryFee), n(o.discount), r2(c.revenue), r2(c.cost), r2(c.profit), o.payment, o.status, o.pickupDate || "", o.pickupTime || "", o.fulfilled ? "yes" : "no", o.notes]); });
    } else {
      rows = [["Date", "Category", "Where / what", "Amount", "Notes"]];
      [...S.expenses].sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(e => rows.push([e.date, e.category, e.vendor, n(e.amount), e.notes]));
    }
    const csv = rows.map(r => r.map(csvCell).join(",")).join("\n");
    try { await S.downloads.save({ filename: `layers-by-the-spoon-${kind}-${today()}.csv`, data: csv }); toast("Saved"); }
    catch (e) { if (e && e.code === "rate_limited") toast("One moment, then try again"); else if (e && e.code !== "declined") toast("Download isn't available here"); }
  }

  // ---------- events ----------
  document.querySelector("nav.tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
  $("#fab").addEventListener("click", () => { if (S.tab === "expenses") expenseForm(); else if (S.tab === "menu") productForm(); else orderForm(); });
  $("#view").addEventListener("click", (e) => {
    const t = e.target;
    const per = t.closest("[data-period]"); if (per) { S.period = per.dataset.period; try { localStorage.setItem("lbs-period", S.period); } catch (_) {} render(); return; }
    const ex = t.closest("[data-export]"); if (ex) { exportCsv(ex.dataset.export); return; }
    const go = t.closest("[data-go]"); if (go) { setTab(go.dataset.go); window.scrollTo(0, 0); return; }
    if (!S.canWrite) return;
    const dn = t.closest("[data-done]"); if (dn) { markDone(dn.dataset.done); return; }
    if (t.closest("[data-goal]")) { goalForm(); return; }
    const mb = t.closest("[data-menu]"); if (mb) { menuAction(mb.dataset.menu); return; }
    const pa = t.closest("[data-prod-act]"); if (pa) { menuAction(pa.dataset.prodAct, pa.dataset.id); return; }
    const eo =t.closest("[data-edit-order]"); if (eo) { const o = S.orders.find(x => x.id === eo.dataset.editOrder); o && orderForm(o); return; }
    const ee = t.closest("[data-edit-exp]"); if (ee) { const x = S.expenses.find(x => x.id === ee.dataset.editExp); x && expenseForm(x); return; }
    const ep = t.closest("[data-edit-prod]"); if (ep) { const p = S.products.find(x => x.id === ep.dataset.editProd); p && productForm(p); return; }
  });
  $("#view").addEventListener("input", (e) => {
    const bk = e.target.dataset.bulk;
    if (bk && S.menuDraft) {
      const row = e.target.closest(".bulk-row"); const d = S.menuDraft[row.dataset.id]; if (!d) return;
      d[bk] = e.target.value;
      return;
    }
    if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} }
  });
  $("#view").addEventListener("change", async (e) => {
    if (e.target.id === "currency" && S.db) {
      S.settings.currency = e.target.value; render();
      try { await S.db.doc("settings/main").set({ ...S.settings }); toast("Currency updated"); } catch (err) { handleWriteError(err); }
    }
  });

  // ---------- boot ----------
  setTab(S.tab);
  (async () => {
    const [db, user, downloads] = await Promise.all([
      window.claude?.use ? window.claude.use("db").catch(() => null) : null,
      window.claude?.use ? window.claude.use("user").catch(() => null) : null,
      window.claude?.use ? window.claude.use("downloads").catch(() => null) : null,
    ]);
    S.downloads = downloads;
    if (!db) { S.canWrite = false; setTab(S.tab); showStatus("Sign in to claude.ai to view and log orders. Your ledger is saved there."); return; }
    S.db = db;
    if (user) { try { const w = await user.can("data.write"); if (w === false) { S.canWrite = false; showStatus("You can view this ledger but not change it. Ask the owner for Contributor or Editor access."); } } catch (_) {} }
    setTab(S.tab);
    const timer = setTimeout(() => showStatus("Can't reach your saved data yet. What you see may be out of date."), 10000);
    let got = 0;
    const done = (k, meta) => { if (!meta.fromCache && !S.loaded[k]) { S.loaded[k] = true; if (++got >= 4) { clearTimeout(timer); if (S.canWrite) showStatus(""); } } };
    const onErr = (k) => (e) => { S.loaded[k] = true; clearTimeout(timer); if (e && e.code !== "revoked") showStatus("Lost the connection to your saved data. Reload the page to reconnect."); render(); };
    const sub = (k) => db.collection(k).onSnapshot((snap) => {
      S[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })); done(k, snap.metadata); render();
    }, onErr(k));
    sub("orders"); sub("expenses"); sub("products"); sub("packs");
    db.doc("settings/main").onSnapshot((d) => { if (d.exists) { S.settings = { currency: "$", ...d.data() }; render(); } }, () => {});
  })();
})();
</script>
