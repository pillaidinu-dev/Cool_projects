services:
  - type: web
    name: plansync
    env: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - Dockerfile
        - client/**
        - server/**
      ignoredPaths:
        - nfl-dashboard/**
        - momentum-dashboard/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false

  - type: web
    name: nfl-dashboard
    env: docker
    branch: main
    dockerfilePath: ./nfl-dashboard/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - nfl-dashboard/**

  - type: web
    name: momentum-dashboard
    env: docker
    branch: main
    dockerfilePath: ./momentum-dashboard/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - momentum-dashboard/**
