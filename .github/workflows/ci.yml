name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Start server and hit health check
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1

  nfl-dashboard-ml:
    name: NFL Dashboard ML pipeline (selftest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-dashboard/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nfl-dashboard/ml/requirements.txt

      - run: pip install -r requirements.txt
      - run: python tests/selftest.py

  nfl-dashboard-client:
    name: NFL Dashboard client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-dashboard/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nfl-dashboard/client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nfl-dashboard-server:
    name: NFL Dashboard server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-dashboard/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nfl-dashboard/server/package-lock.json

      - run: npm ci

      - name: Start server and hit health check
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4100/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1

  nba-dashboard-ml:
    name: NBA Dashboard ML pipeline (selftest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-dashboard/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nba-dashboard/ml/requirements.txt

      - run: pip install -r requirements.txt
      - run: python tests/selftest.py

  nba-dashboard-client:
    name: NBA Dashboard client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-dashboard/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nba-dashboard/client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nba-dashboard-server:
    name: NBA Dashboard server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-dashboard/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nba-dashboard/server/package-lock.json

      - run: npm ci

      - name: Start server and hit health + props
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4200/api/health; then
              curl -sf http://localhost:4200/api/props/latest > /dev/null
              curl -sf http://localhost:4200/api/props/history > /dev/null
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1

  gold-tracker-client:
    name: Gold Tracker client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-tracker/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gold-tracker/client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gold-tracker-server:
    name: Gold Tracker server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-tracker/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gold-tracker/server/package-lock.json

      - run: npm ci

      - name: Start server and hit health check
        run: |
          node --no-warnings src/index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for _ in $(seq 1 10); do
            if curl -sf http://localhost:4400/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          exit 1
